<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Be My Valentine?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink-light: #ffe4ef;
      --pink-mid:   #ffb6c1;
      --pink-deep:  #f472a8;
      --green:      #3dba74;
      --green-dark: #2a9a5c;
      --red:        #e84040;
      --red-dark:   #c02020;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--pink-light);
      background-image:
        radial-gradient(ellipse at 20% 30%, #ffd6e8 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, #ffc2d4 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #fff0f6 0%, transparent 80%);
      font-family: 'Lato', sans-serif;
      overflow: hidden;
      position: relative;
      cursor: default;
    }

    /* Floating hearts background */
    .hearts-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .heart-float {
      position: absolute;
      font-size: 1.4rem;
      opacity: 0.18;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(-15deg); opacity: 0; }
      10%  { opacity: 0.18; }
      90%  { opacity: 0.18; }
      100% { transform: translateY(-10vh) rotate(15deg); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255,182,193,0.6);
      border-radius: 32px;
      padding: 56px 64px 52px;
      text-align: center;
      box-shadow:
        0 8px 48px rgba(244,114,168,0.18),
        0 2px 12px rgba(244,114,168,0.10);
      max-width: 480px;
      width: 90vw;
      animation: popIn 0.7s cubic-bezier(.22,1.4,.64,1) both;
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .emoji-top {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: #c2185b;
      line-height: 1.25;
      margin-bottom: 36px;
      letter-spacing: -0.01em;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.02em;
    }

    #yes-btn {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      box-shadow: 0 4px 18px rgba(61,186,116,0.38);
    }
    #yes-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 28px rgba(61,186,116,0.5);
    }
    #yes-btn:active { transform: scale(0.97); }

    #no-btn {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: #fff;
      box-shadow: 0 4px 18px rgba(232,64,64,0.35);
      position: fixed; /* will be repositioned by JS */
      z-index: 10;
    }

    /* ---- YES overlay ---- */
    #yes-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(255,220,235,0.55);
      backdrop-filter: blur(6px);
    }
    #yes-overlay.show { display: flex; }

    #yay-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.4rem, 8vw, 5rem);
      color: #c2185b;
      text-shadow: 0 4px 32px rgba(194,24,91,0.25);
      animation: yayBounce 0.6s cubic-bezier(.22,1.6,.64,1) both;
      text-align: center;
      padding: 0 24px;
    }
    @keyframes yayBounce {
      from { transform: scale(0.4) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0);      opacity: 1; }
    }

    /* ---- Confetti canvas ---- */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="hearts-bg" id="hearts-bg"></div>

  <!-- Main card -->
  <div class="card">
    <span class="emoji-top">💕</span>
    <h1>Will you be my Valentine?</h1>
    <div class="buttons">
      <button id="yes-btn" onclick="onYes()">Yes! 💖</button>
      <button id="no-btn">No 🙈</button>
    </div>
  </div>

  <!-- Yes overlay -->
  <div id="yes-overlay">
    <div id="yay-text">Yaaaayyyyyy!!!!!!!!!!</div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    /* ---- Floating hearts ---- */
    const bg = document.getElementById('hearts-bg');
    const HEARTS = ['💕','💗','💓','💞','🌸','✨','💝','🩷'];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement('span');
      el.className = 'heart-float';
      el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (9 + Math.random() * 12) + 's';
      el.style.animationDelay   = -(Math.random() * 20) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(el);
    }

    /* ---- Runaway No button ---- */
    const noBtn = document.getElementById('no-btn');
    const PAD   = 12;

    // Initial placement: mirror of yes button
    function initNoBtn() {
      const yes = document.getElementById('yes-btn').getBoundingClientRect();
      noBtn.style.left = (yes.right + 20) + 'px';
      noBtn.style.top  = yes.top + 'px';
    }
    window.addEventListener('load', initNoBtn);
    window.addEventListener('resize', initNoBtn);

    document.addEventListener('mousemove', (e) => {
      const r   = noBtn.getBoundingClientRect();
      const cx  = r.left + r.width  / 2;
      const cy  = r.top  + r.height / 2;
      const dx  = e.clientX - cx;
      const dy  = e.clientY - cy;
      const dist = Math.hypot(dx, dy);
      const THRESHOLD = 130;

      if (dist < THRESHOLD) {
        const angle  = Math.atan2(dy, dx);
        const push   = (THRESHOLD - dist) * 1.3 + 40;
        let newLeft  = r.left - Math.cos(angle) * push;
        let newTop   = r.top  - Math.sin(angle) * push;

        // Keep inside viewport
        newLeft = Math.max(PAD, Math.min(window.innerWidth  - r.width  - PAD, newLeft));
        newTop  = Math.max(PAD, Math.min(window.innerHeight - r.height - PAD, newTop));

        noBtn.style.transition = 'left 0.25s cubic-bezier(.22,1,.36,1), top 0.25s cubic-bezier(.22,1,.36,1)';
        noBtn.style.left = newLeft + 'px';
        noBtn.style.top  = newTop  + 'px';
      }
    });

    /* ---- Yes action ---- */
    function onYes() {
      document.getElementById('yes-overlay').classList.add('show');
      launchConfetti();
    }

    /* ---- Confetti ---- */
    const canvas = document.getElementById('confetti-canvas');
    const ctx    = canvas.getContext('2d');
    let pieces   = [];
    let animId   = null;

    const COLORS = ['#f472a8','#ff8fab','#ffb6c1','#ff4d6d','#c77dff','#ffd700','#3dba74','#60d394','#ffc2d4'];

    function launchConfetti() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      pieces = [];
      for (let i = 0; i < 180; i++) {
        pieces.push({
          x:    Math.random() * canvas.width,
          y:    -20 - Math.random() * canvas.height * 0.5,
          w:    6  + Math.random() * 9,
          h:    4  + Math.random() * 6,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          vx:   (Math.random() - 0.5) * 3,
          vy:   2.5 + Math.random() * 3.5,
          rot:  Math.random() * Math.PI * 2,
          vr:   (Math.random() - 0.5) * 0.15,
          shape: Math.random() < 0.4 ? 'circle' : 'rect',
          alpha: 1,
        });
      }

      if (animId) cancelAnimationFrame(animId);
      drawConfetti();
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;

      for (const p of pieces) {
        p.x   += p.vx;
        p.y   += p.vy;
        p.rot += p.vr;
        p.vy  += 0.06; // gravity

        if (p.y < canvas.height + 30) alive = true;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;

        if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        ctx.restore();
      }

      if (alive) {
        animId = requestAnimationFrame(drawConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    window.addEventListener('resize', () => {
      if (pieces.length) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    });
  </script>
</body>
</html>
